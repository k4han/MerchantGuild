plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.modrinth.minotaur'
}

group = 'com.virusker'
version = findProperty('releaseVersion') ?: '1.2'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "sonatype"
        url = "https://oss.sonatype.org/content/groups/public/"
    }
    maven { url 'https://jitpack.io' }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.69-stable")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"


}


dependencies {
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: 'org.bukkit', module: 'bukkit'
    }
}


def targetJavaVersion = 25
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def props = [version: version]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
kotlin {
    jvmToolchain(25)
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN")
    projectId = System.getenv("MODRINTH_PROJECT_ID")
    versionNumber = project.version.toString()
    versionName = project.version.toString()
    versionType = "release"
    uploadFile = jar.archiveFile
    gameVersions = (System.getenv("MODRINTH_GAME_VERSIONS") ?: "1.21.1").split(",") as List
    loaders = (System.getenv("MODRINTH_LOADERS") ?: "paper,purpur,folia").split(",") as List
}
